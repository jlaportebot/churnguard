[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "0.2.0"
description = "Customer churn prediction CLI and library with ML model comparison, threshold optimization, and SHAP explainability"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "John LaPorte"},
]
keywords = ["churn", "prediction", "machine-learning", "cli", "customer-retention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "joblib>=1.2",
    "rich>=13.0",
    "pyyaml>=6.0",
    "shap>=0.42",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "seaborn>=0.12"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
churnguard = "churnguard.cli:main"

[project.entry-points."churnguard.models"]
logistic = "churnguard.models.logistic:LogisticChurnModel"
random_forest = "churnguard.models.random_forest:RandomForestChurnModel"
gradient_boosting = "churnguard.models.gradient_boosting:GradientBoostingChurnModel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N806", "N803"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
