name: Feature Request
about: Propose a new feature or enhancement
title: "[FEAT] "
labels: ["enhancement"]
assignees: ""
body:
  - type: markdown
    attributes:
      value: "Thanks for the idea! Describe what you'd like to see."
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Why is it needed?
      placeholder: "No way to export SHAP values to JSON for downstream processing..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work? API, CLI flags, config options.
      placeholder: "Add `--export-shap json` flag to `churnguard explain` that writes SHAP values to a file..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What else did you think of?
      placeholder: "Could post-process the explainer object, but CLI flag is more discoverable"
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small (CLI flag, config option, single function)
        - Medium (new model, threshold strategy, viz type)
        - Large (new command, major pipeline change)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (commands, flags, output formatting)
        - Pipeline (orchestration, config)
        - Models (new algorithms, entry points)
        - Threshold optimization (strategies, cost matrices)
        - Explainability (SHAP, global/local, export)
        - Evaluation (metrics, CV, comparison)
        - Features (preprocessing, engineering)
        - Business impact (ROI, cost modeling)
        - Visualization (plots, export formats)
        - Tests / CI / tooling
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: willingness
    attributes:
      label: Willingness
      options:
        - label: I'll implement this (assign me)
        - label: I can test / review
        - label: Just the idea
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, links to related issues, references.