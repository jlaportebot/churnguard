name: Question / Help
about: Ask a question about using ChurnGuard
title: "[QUESTION] "
labels: ["question"]
assignees: ""
body:
  - type: markdown
    attributes:
      value: "Got a question? Ask away."
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What do you need help with?
      placeholder: "How do I use a custom cost matrix with the threshold optimizer? The docs mention CostMatrix but not how to pass it via CLI..."
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - CLI usage
        - Python API usage
        - Model selection / training
        - Threshold optimization
        - SHAP explainability
        - Configuration (YAML)
        - Installation / dependencies
        - Visualization
        - Contributing / development
        - Other
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What Have You Tried?
      description: Docs, search, experiments — helps us give a better answer.
      placeholder: "Read README, checked threshold.py, tried --cost-fn but got error..."
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-check
      options:
        - label: I checked the README
          required: false
        - label: I searched existing issues/discussions
          required: false
        - label: This isn't a bug report (use Bug Report template instead)
          required: true